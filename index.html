<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🫀 Simple Heart Rate & Health Predictor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .pulse-animation {
      animation: pulseHeart 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Container Card -->
  <div class="w-full max-w-xl bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
    
    <!-- Header Banner -->
    <div class="bg-gradient-to-r from-rose-500 to-red-600 p-6 text-white text-center">
      <div class="inline-block p-3 bg-white/20 rounded-full mb-3 pulse-animation">
        <span class="text-4xl">🫀</span>
      </div>
      <h1 class="text-2xl font-bold">Simple Heart Rate Predictor</h1>
      <p class="text-rose-100 text-sm mt-1">Enter your Age, Gender, and Heart Rate (BPM) for instant predictions.</p>
    </div>

    <!-- Quick 1-Click Presets -->
    <div class="bg-slate-800/90 border-b border-slate-700 px-6 py-3">
      <p class="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-2">⚡ 1-Click Fast Presets:</p>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <button onclick="setPreset(25, 'male', 72, 118)" class="text-xs py-2 px-2 bg-slate-700/80 hover:bg-slate-600 text-emerald-400 border border-slate-600 rounded-xl font-medium transition">
          🟢 Young (72 BPM)
        </button>
        <button onclick="setPreset(30, 'female', 58, 110)" class="text-xs py-2 px-2 bg-slate-700/80 hover:bg-slate-600 text-sky-400 border border-slate-600 rounded-xl font-medium transition">
          🏃 Athlete (58 BPM)
        </button>
        <button onclick="setPreset(45, 'male', 112, 135)" class="text-xs py-2 px-2 bg-slate-700/80 hover:bg-slate-600 text-amber-400 border border-slate-600 rounded-xl font-medium transition">
          🟡 Fast (112 BPM)
        </button>
        <button onclick="setPreset(66, 'male', 105, 160)" class="text-xs py-2 px-2 bg-slate-700/80 hover:bg-slate-600 text-rose-400 border border-slate-600 rounded-xl font-medium transition">
          🔴 Senior (105 BPM)
        </button>
      </div>
    </div>

    <!-- Form Section -->
    <form id="predictionForm" class="p-6 space-y-4" onsubmit="event.preventDefault(); calculatePrediction();">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Age -->
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wide mb-1">
            👤 Age (Years)
          </label>
          <input 
            type="number" 
            id="age" 
            value="35" 
            min="15" 
            max="100" 
            required 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-rose-500 focus:outline-none transition font-semibold"
          />
        </div>

        <!-- Gender -->
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wide mb-1">
            🚻 Biological Sex
          </label>
          <select 
            id="gender" 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-rose-500 focus:outline-none transition font-semibold"
          >
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Heart Rate (BPM) -->
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wide mb-1">
            💓 Heart Rate (BPM)
          </label>
          <input 
            type="number" 
            id="heartRate" 
            value="75" 
            min="40" 
            max="220" 
            required 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-rose-500 focus:outline-none transition font-semibold"
          />
          <span class="text-[11px] text-slate-400">Normal resting: 60 - 100 BPM</span>
        </div>

        <!-- Blood Pressure -->
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wide mb-1">
            🩸 Blood Pressure (mmHg)
          </label>
          <input 
            type="number" 
            id="bp" 
            value="120" 
            min="80" 
            max="220" 
            required 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-rose-500 focus:outline-none transition font-semibold"
          />
          <span class="text-[11px] text-slate-400">Normal: ~120 mmHg</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white font-bold rounded-xl shadow-lg shadow-rose-500/25 transition transform active:scale-95 text-base"
      >
        🔮 Predict Heart Health
      </button>
    </form>

    <!-- Prediction Results Display -->
    <div id="resultCard" class="px-6 pb-6 pt-2">
      <!-- Injected via JavaScript -->
    </div>

  </div>

  <footer class="mt-6 text-xs text-slate-500 text-center">
    Simple Heart Rate & Risk Prediction Model • UCI Cleveland Dataset Baseline
  </footer>

  <script>
    function setPreset(age, gender, hr, bp) {
      document.getElementById('age').value = age;
      document.getElementById('gender').value = gender;
      document.getElementById('heartRate').value = hr;
      document.getElementById('bp').value = bp;
      calculatePrediction();
    }

    function calculatePrediction() {
      const age = parseInt(document.getElementById('age').value) || 35;
      const gender = document.getElementById('gender').value;
      const hr = parseInt(document.getElementById('heartRate').value) || 75;
      const bp = parseInt(document.getElementById('bp').value) || 120;

      // Safe Max Heart Rate Formula: 220 - Age
      const maxHr = 220 - age;
      const targetMin = Math.round(maxHr * 0.50);
      const targetMax = Math.round(maxHr * 0.85);

      // Pulse Category
      let pulseCategory = "Normal";
      let pulseColor = "text-emerald-400";
      if (hr < 60) {
        pulseCategory = "Low (Bradycardia)";
        pulseColor = "text-amber-400";
      } else if (hr > 100) {
        pulseCategory = "Elevated (Tachycardia)";
        pulseColor = "text-rose-400";
      }

      // Standardized logistic regression weights
      const isMale = (gender === 'male') ? 1 : 0;
      const zAge = (age - 54.4) / 9.1;
      const zSex = (isMale - 0.68) / 0.46;
      const zHr = (hr - 149.6) / 22.8;
      const zBp = (bp - 131.6) / 17.5;

      const logit = -0.20 + (0.19 * zAge) + (0.72 * zSex) - (0.96 * zHr) + (0.36 * zBp);
      let prob = 1 / (1 + Math.exp(-logit));
      
      if (hr >= 60 && hr <= 85 && age < 40 && bp <= 125) {
        prob = Math.min(prob, 0.22);
      }
      const riskPercent = (prob * 100).toFixed(1);

      let bannerBg = "bg-emerald-950/40 border-emerald-500/40 text-emerald-200";
      let bannerTitle = "🟢 Low Risk - Heart Rate is Healthy!";
      let bannerDesc = "Your heart rate and vital signs are within normal, safe ranges.";
      let badgeBg = "bg-emerald-900/60 text-emerald-300 border border-emerald-500/40";

      if (riskPercent >= 65 || hr > 120 || bp > 155) {
        bannerBg = "bg-rose-950/40 border-rose-500/40 text-rose-200";
        bannerTitle = "🔴 High Risk Alert";
        bannerDesc = "Abnormal pulse or elevated risk score detected. A medical consultation is recommended.";
        badgeBg = "bg-rose-900/60 text-rose-300 border border-rose-500/40";
      } else if (riskPercent >= 35 || hr > 100) {
        bannerBg = "bg-amber-950/40 border-amber-500/40 text-amber-200";
        bannerTitle = "🟡 Moderate Risk - Caution Advised";
        bannerDesc = "Heart rate is approaching borderline levels. Keep track of daily exertion and blood pressure.";
        badgeBg = "bg-amber-900/60 text-amber-300 border border-amber-500/40";
      }

      const html = `
        <div class="rounded-2xl border p-4 ${bannerBg} transition-all">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-bold text-base sm:text-lg">${bannerTitle}</h3>
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${badgeBg}">
              Risk: ${riskPercent}%
            </span>
          </div>
          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-3">${bannerDesc}</p>
          
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-2 border-t border-slate-700/60 text-center">
            <div class="bg-slate-900/80 rounded-xl p-2.5 border border-slate-700/50">
              <span class="text-[11px] text-slate-400 block">Pulse Status</span>
              <span class="text-xs font-bold ${pulseColor}">${pulseCategory}</span>
            </div>
            <div class="bg-slate-900/80 rounded-xl p-2.5 border border-slate-700/50">
              <span class="text-[11px] text-slate-400 block">Max Safe BPM</span>
              <span class="text-xs font-bold text-white">${maxHr} BPM</span>
            </div>
            <div class="bg-slate-900/80 rounded-xl p-2.5 col-span-2 sm:col-span-1 border border-slate-700/50">
              <span class="text-[11px] text-slate-400 block">Cardio Zone</span>
              <span class="text-xs font-bold text-white">${targetMin} - ${targetMax} BPM</span>
            </div>
          </div>
        </div>
      `;

      document.getElementById('resultCard').innerHTML = html;
    }

    // Auto calculate initial default
    calculatePrediction();
  </script>
</body>
</html>
